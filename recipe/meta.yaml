{% set name = "perl-package-stash" %}
{% set version = "0.40" %}
{% set sha256 = "5a9722c6d9cb29ee133e5f7b08a5362762a0b5633ff5170642a5b0686e95e066" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/E/ET/ETHER/Package-Stash-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 3
  run_exports:
    weak:
      - {{ name }} ={{ version }}
  script:
    - perl Makefile.PL INSTALLDIRS=vendor
    - make
    - make test     # [target_platform == build_platform]  
    - make install

requirements:
  build:
    - make
  host:
    - perl
    - perl-cpan-meta-check
    - perl-dist-checkconflicts
    - perl-module-implementation
    - perl-package-stash-xs
    - perl-test-needs
  run:
    - perl
    - perl-dist-checkconflicts
    - perl-module-implementation

test:
  imports:
    - Package::Stash
    - Package::Stash::PP

about:
  home: https://github.com/moose/Package-Stash
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_file: LICENSE
  summary: 'Routines for manipulating stashes'

extra:
  recipe-maintainers:
    - xileF1337
    - conda-forge/perl-packagers
